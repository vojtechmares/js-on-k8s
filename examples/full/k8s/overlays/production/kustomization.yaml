apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-production
resources:
  - ../../base
images:
  - name: ghcr.io/vojtechmares/js-on-k8s-example
    newTag: 1.0.0
replicas:
  - name: app
    count: 3
configMapGenerator:
  - name: app
    behavior: merge
    literals:
      - LOG_LEVEL=warn
