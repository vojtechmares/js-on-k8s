# Deployment is handled by Cloudflare Workers Builds (GitHub integration):
# every push to main runs `pnpm build` and `wrangler deploy` on Cloudflare,
# and pull requests get preview URLs. This workflow only checks the build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Smoke test Markdown twins and Worker config
        run: |
          test -f dist/index.md
          test -f dist/recipes/index.md
          test -f dist/recipes/graceful-shutdown.md
          grep -q 'text/markdown' dist/index.html
          pnpm exec wrangler deploy --dry-run --outdir /tmp/wd > /dev/null
      - uses: gacts/install-hurl@v1
      - name: Smoke test against a local preview
        run: |
          pnpm exec wrangler dev --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8787/ && break; sleep 1; done
          hurl --test --variable base=http://localhost:8787 tests/smoke.hurl
